name: CI
concurrency:
  # One group per PR (head_ref) and one per pushed branch (ref). A PR cancels its
  # superseded run. A push lets the running one finish and waits; a newer push replaces
  # the waiting one, so pushes that land mid-run collapse into a single follow-up run.
  # merge_group, schedule and workflow_dispatch (releases) runs each get their own group.
  group: ci-${{ github.head_ref || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name != 'push' }}
on:
  # The merge queue batches PRs into the protected branches (master, develop). It
  # builds no firmware: PRs build the narrowed board subset (--level pr, see the setup
  # job) and push runs the full matrix on master/develop after merge, as well as on
  # the event/* and feature/* branches, which have no merge queue. Static checks (pio
  # check) run on PRs only.
  merge_group:
    types: [checks_requested]
    branches:
      - master
      - develop

  push:
    branches:
      - master
      - develop
      - event/*
      - feature/*
    paths-ignore:
      - "**.md"
      - version.properties

  # No paths-ignore here: ci-gate is the required status check, and a PR that
  # never runs this workflow never reports it, so a docs-only PR cannot merge.
  pull_request:
    branches:
      - master
      - develop
      - event/*
      - feature/*

  schedule:
    # Nightly develop build
    - cron: 0 7 * * * # Nightly develop build (default branch is develop)

  workflow_dispatch:
    inputs:
      nightly:
        description: "Nightly mode: build develop"
        type: boolean
        default: false

permissions: read-all

jobs:
  setup:
    # The merge queue only batches PRs: skipping setup skips the firmware build and
    # check matrices that depend on it. ci-gate accepts that skip on merge_group.
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          # Needed to diff against the base branch for newly added variants.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -U platformio
      - name: Generate matrix
        id: jsonStep
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # A new board is 'release' and gets no CI until after merge, so force-build the
          # first env of each ADDED variant config. A new env in an existing one does not count.
          DIFF_BASE=""
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            # checkout above already fetched every branch (fetch-depth: 0), so the base ref
            # is local. Do not re-fetch it with --depth=1: that grafts the fetched tip as
            # parentless, and merge-base then finds no common commit whenever the base
            # branch has moved past this merge commit, which is every re-run of an older run.
            DIFF_BASE=$(git merge-base "origin/$BASE_REF" HEAD)
          fi
          ADDED_ARGS=()
          if [[ -n "$DIFF_BASE" ]]; then
            # Assign rather than pipe: a failing diff must abort the step under 'set -e',
            # not silently yield an empty list and drop the new board from the matrix.
            ADDED_CONFIGS=$(git diff --name-only --diff-filter=A \
              "$DIFF_BASE" HEAD -- 'variants/**/platformio.ini')
            while IFS= read -r cfg; do
              [[ -n "$cfg" ]] && ADDED_ARGS+=(--added-config "$cfg")
            done <<<"$ADDED_CONFIGS"
          fi
          # PRs use the narrowed --level pr board subset. Full-matrix builds run on
          # push / schedule / workflow_dispatch.
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            TARGETS=$(./bin/generate_ci_matrix.py all --level pr "${ADDED_ARGS[@]}")
          else
            TARGETS=$(./bin/generate_ci_matrix.py all)
          fi
          echo "Name: $GITHUB_REF_NAME Base: $GITHUB_BASE_REF Ref: $GITHUB_REF"
          echo "all=$TARGETS" >> $GITHUB_OUTPUT
          echo "$TARGETS" >> $GITHUB_STEP_SUMMARY
    outputs:
      all: ${{ steps.jsonStep.outputs.all }}

  version:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Get release version string
        run: |
          echo "long=$(./bin/buildinfo.py long)" >> $GITHUB_OUTPUT
          echo "deb=$(./bin/buildinfo.py deb)" >> $GITHUB_OUTPUT
        id: version
        env:
          BUILD_LOCATION: local
    outputs:
      long: ${{ steps.version.outputs.long }}
      deb: ${{ steps.version.outputs.deb }}

  check:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJson(needs.setup.outputs.all) }}
    # Runs on GitHub-hosted runners so checks don't compete with builds for the
    # self-hosted 'arctastic' pool (which builds use).
    runs-on: ubuntu-26.04
    # PRs only: the merge queue builds and checks no firmware.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Check ${{ matrix.check.board }}
        uses: meshtastic/gh-action-firmware@main
        with:
          pio_platform: ${{ matrix.check.platform }}
          pio_env: ${{ matrix.check.board }}
          pio_target: check

  build:
    needs: [setup, version]
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJson(needs.setup.outputs.all) }}
    uses: ./.github/workflows/build_firmware.yml
    with:
      version: ${{ needs.version.outputs.long }}
      pio_env: ${{ matrix.build.board }}
      platform: ${{ matrix.build.platform }}
    secrets:
      MEMBROWSE_API_KEY: ${{ secrets.MEMBROWSE_API_KEY }}

  package-pio-deps-native-tft:
    if: github.repository_owner == 'QuadrifoglioVerde' && github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/package_pio_deps.yml
    with:
      pio_env: native-tft
    secrets: inherit

  # Single, stable status check for branch protection.
  ci-gate:
    if: contains(fromJSON('["pull_request", "merge_group"]'), github.event_name) && !cancelled()
    needs: [build, check]
    runs-on: ubuntu-slim
    steps:
      - name: Verify build and check results
        run: |
          echo "build=${{ needs.build.result }} check=${{ needs.check.result }}"
          case "$GITHUB_EVENT_NAME:${{ needs.build.result }}" in
            *:success | merge_group:skipped) ;;
            *)
              echo "::error::One or more firmware builds failed, were cancelled, or did not run."
              exit 1
              ;;
          esac
          case "${{ needs.check.result }}" in
            success | skipped) ;;
            *)
              echo "::error::One or more checks failed or were cancelled (${{ needs.check.result }})."
              exit 1
              ;;
          esac

  gather-artifacts:
    if: github.repository_owner == 'QuadrifoglioVerde' && contains(fromJSON('["workflow_dispatch", "schedule"]'), github.event_name)
    strategy:
      fail-fast: false
      matrix:
        arch:
          - esp32
          - esp32s3
          - esp32c3
          - esp32c6
          - nrf52840
          - stm32
    runs-on: ubuntu-26.04
    needs: [version, build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: ./
          pattern: firmware-${{matrix.arch}}-*
          merge-multiple: true

      - name: Display structure of downloaded files
        run: ls -R

      - name: Repackage in single firmware zip
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{matrix.arch}}-${{ needs.version.outputs.long }}
          overwrite: true
          path: |
            ./firmware-*.mt.json
            ./firmware-*.bin
            ./firmware-*.uf2
            ./firmware-*.hex
            ./firmware-*.zip
            ./device-*.sh
            ./device-*.bat
            ./littlefs-*.bin
            ./bleota*bin
            ./mt-*-ota.bin
            ./Meshtastic_nRF52_factory_erase*.uf2
          retention-days: 30

      - uses: actions/download-artifact@v8
        with:
          name: firmware-${{matrix.arch}}-${{ needs.version.outputs.long }}
          merge-multiple: true
          path: ./output

      - name: Show artifacts
        run: ls -lR

      - name: Device scripts permissions
        run: |
          chmod +x ./output/device-install.sh || true
          chmod +x ./output/device-update.sh || true

      - name: Zip firmware
        run: zip -j -9 -r ./firmware-${{matrix.arch}}-${{ needs.version.outputs.long }}.zip ./output

      - name: Repackage in single elfs zip
        uses: actions/upload-artifact@v7
        with:
          name: debug-elfs-${{matrix.arch}}-${{ needs.version.outputs.long }}
          overwrite: true
          path: ./*.elf
          retention-days: 30

  firmware-size-report:
    if: github.repository_owner == 'QuadrifoglioVerde' && github.event_name != 'schedule' && github.event.inputs.nightly != 'true'
    continue-on-error: true
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-26.04
    needs: [build]
    steps:
      - uses: actions/checkout@v7

      - name: Download current manifests
        uses: actions/download-artifact@v8
        with:
          path: ./manifests/
          pattern: manifest-*
          merge-multiple: true

      - name: Collect current firmware sizes
        run: python3 bin/collect_sizes.py ./manifests/ ./current-sizes.json

      - name: Upload size report artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware-sizes-${{ github.sha }}
          overwrite: true
          path: ./current-sizes.json
          retention-days: 90

  size-budget-gate:
    if: github.event_name != 'schedule' && github.event.inputs.nightly != 'true'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-26.04
    needs: [build]
    steps:
      - uses: actions/checkout@v7

      - name: Download current manifests
        uses: actions/download-artifact@v8
        with:
          path: ./manifests/
          pattern: manifest-*
          merge-multiple: true

      - name: Collect current firmware sizes
        run: python3 bin/collect_sizes.py ./manifests/ ./current-sizes.json

      - name: Enforce RAM/flash budgets
        run: python3 bin/size_report.py ./current-sizes.json --budgets bin/ram_budgets.json --enforce-budgets

  release-artifacts:
    permissions:
      contents: write
    runs-on: ubuntu-26.04
    if: github.repository_owner == 'QuadrifoglioVerde' && github.event_name == 'workflow_dispatch' && github.event.inputs.nightly != 'true'
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    needs:
      - setup
      - version
      - gather-artifacts
      - package-pio-deps-native-tft
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.x

      - name: Generate release notes
        id: release_notes
        run: |
          chmod +x ./bin/generate_release_notes.py
          NOTES=$(./bin/generate_release_notes.py ${{ needs.version.outputs.long }} --compare-ref HEAD 2>release_notes.log)
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v3
        id: create_release
        with:
          draft: true
          prerelease: true
          name: Meshtastic Firmware ${{ needs.version.outputs.long }} Alpha
          tag_name: v${{ needs.version.outputs.long }}
          target_commitish: ${{ github.sha }}
          body: ${{ steps.release_notes.outputs.notes }}

      - name: Generate Release manifest
        run: |
          jq -n --arg ver "${{ needs.version.outputs.long }}" --argjson targets ${{ toJson(needs.setup.outputs.all) }} '{
            "version": $ver,
            "targets": $targets
          }' > firmware-${{ needs.version.outputs.long }}.json

      - name: Save Release manifest artifact
        uses: actions/upload-artifact@v7
        with:
          name: manifest-${{ needs.version.outputs.long }}
          overwrite: true
          path: firmware-${{ needs.version.outputs.long }}.json

  release-firmware:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        arch:
          - esp32
          - esp32s3
          - esp32c3
          - esp32c6
          - nrf52840
          - stm32
    runs-on: ubuntu-26.04
    if: github.repository_owner == 'QuadrifoglioVerde' && github.event_name == 'workflow_dispatch' && github.event.inputs.nightly != 'true'
    needs: [release-artifacts, version]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.x

      - uses: actions/download-artifact@v8
        with:
          pattern: firmware-${{matrix.arch}}-${{ needs.version.outputs.long }}
          merge-multiple: true
          path: ./output

      - name: Device scripts permissions
        run: |
          chmod +x ./output/device-install.sh || true
          chmod +x ./output/device-update.sh || true

      - name: Zip firmware
        run: zip -j -9 -r ./firmware-${{matrix.arch}}-${{ needs.version.outputs.long }}.zip ./output

      - uses: actions/download-artifact@v8
        with:
          name: debug-elfs-${{matrix.arch}}-${{ needs.version.outputs.long }}
          merge-multiple: true
          path: ./elfs

      - name: Zip debug elfs
        run: zip -j -9 -r ./debug-elfs-${{matrix.arch}}-${{ needs.version.outputs.long }}.zip ./elfs

      - name: Add bins and debug elfs to GitHub Release
        if: github.ref_name == github.event.repository.default_branch
        run: |
          gh release upload v${{ needs.version.outputs.long }} ./firmware-${{matrix.arch}}-${{ needs.version.outputs.long }}.zip
          gh release upload v${{ needs.version.outputs.long }} ./debug-elfs-${{matrix.arch}}-${{ needs.version.outputs.long }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-firmware:
    runs-on: ubuntu-24.04
    if: github.repository_owner == 'QuadrifoglioVerde' && github.event_name == 'workflow_dispatch' && github.event.inputs.nightly != 'true'
    needs: [release-firmware, version]
    env:
      targets: esp32,esp32s3,esp32c3,esp32c6,nrf52840,stm32
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.x

      - name: Get release version string
        run: echo "long=$(./bin/buildinfo.py long)" >> $GITHUB_OUTPUT
        id: version

      - name: Get firmware artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: firmware-{${{ env.targets }}}-${{ steps.version.outputs.long }}
          merge-multiple: true
          path: ./publish

      - name: Get manifest artifact
        uses: actions/download-artifact@v8
        with:
          pattern: manifest-${{ steps.version.outputs.long }}
          path: ./publish

      - name: Generate release notes
        run: |
          chmod +x ./bin/generate_release_notes.py
          ./bin/generate_release_notes.py ${{ steps.version.outputs.long }} --compare-ref HEAD > ./publish/release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish firmware to msh-fw-release repo
        uses: peaceiris/actions-gh-pages@v4
        env:
          DEST_PREFIX: ${{ contains(github.ref_name, 'event/') && format('{0}/', github.ref_name) || '' }}
        with:
          deploy_key: ${{ secrets.RELEASE_KEY }}
          external_repository: QuadrifoglioVerde/msh-fw-release
          publish_branch: main
          publish_dir: ./publish
          destination_dir: ${{ env.DEST_PREFIX }}firmware-${{ steps.version.outputs.long }}
          keep_files: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: ${{ steps.version.outputs.long }}
          enable_jekyll: true